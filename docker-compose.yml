version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag_backend_core
    restart: always
    volumes:
      - chroma_data:/app/chroma_db
      - uploaded_docs:/app/uploaded_docs_day54
    networks:
      - rag_internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 20s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag_frontend_spa
    restart: always
    networks:
      - rag_internal_network

  gateway:
    image: nginx:alpine
    container_name: rag_nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx_gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - rag_internal_network

volumes:
  chroma_data:
    name: rag_chroma_storage
  uploaded_docs:
    name: rag_uploaded_docs_storage

networks:
  rag_internal_network:
    name: rag_internal_net
    driver: bridge
